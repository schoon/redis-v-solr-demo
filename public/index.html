<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Counterparty Search — Redis vs Solr</title>
  <style>
    :root {
      --bg: #0f1115;
      --panel: #171a21;
      --panel-2: #1d212a;
      --line: #2a2f3a;
      --text: #e6e8ec;
      --muted: #8b93a3;
      --redis: #ff4438;
      --solr: #4a9ed9;
      --good: #35c46b;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0; background: var(--bg); color: var(--text);
      font-family: -apple-system, system-ui, "Segoe UI", sans-serif;
      line-height: 1.45;
    }
    .wrap { max-width: 1200px; margin: 0 auto; padding: 1.5rem 1.25rem 4rem; }

    header { display: flex; align-items: baseline; gap: 1rem; flex-wrap: wrap; }
    h1 { font-size: 1.35rem; margin: 0; font-weight: 650; }
    .corpus { color: var(--muted); font-size: 0.8rem; font-variant-numeric: tabular-nums; }
    .corpus b { color: var(--text); font-weight: 600; }

    .scenarios { display: flex; gap: 0.4rem; margin: 1.25rem 0 0.75rem; flex-wrap: wrap; }
    .scenarios button {
      background: var(--panel); color: var(--muted); border: 1px solid var(--line);
      padding: 0.45rem 0.85rem; border-radius: 999px; cursor: pointer;
      font-size: 0.85rem; font-family: inherit;
    }
    .scenarios button:hover { color: var(--text); }
    .scenarios button.active {
      background: var(--panel-2); color: var(--text); border-color: #3d4450;
    }
    .hint { color: var(--muted); font-size: 0.8rem; margin: 0 0 0.9rem; min-height: 1.2rem; }

    .controls { display: flex; gap: 0.6rem; flex-wrap: wrap; align-items: center; }
    input[type="text"], select {
      background: var(--panel); color: var(--text); border: 1px solid var(--line);
      border-radius: 8px; padding: 0.6rem 0.75rem; font-size: 0.95rem;
      font-family: inherit;
    }
    input[type="text"] { flex: 1; min-width: 14rem; }
    input:focus, select:focus { outline: 1px solid #4a5262; }
    label.inline { color: var(--muted); font-size: 0.8rem; display: flex; align-items: center; gap: 0.35rem; }
    .filters { display: none; gap: 0.6rem; flex-wrap: wrap; margin-top: 0.6rem; align-items: center; }
    .filters.show { display: flex; }

    .summary {
      display: grid; grid-template-columns: 1fr auto 1fr; gap: 1rem;
      align-items: center; margin: 1.5rem 0 0.5rem;
    }
    .metric { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 0.9rem 1rem; }
    .metric .engine { font-size: 0.7rem; letter-spacing: 0.09em; text-transform: uppercase; color: var(--muted); }
    .metric .time { font-size: 2.1rem; font-weight: 680; font-variant-numeric: tabular-nums; line-height: 1.15; }
    .metric .sub { font-size: 0.75rem; color: var(--muted); font-variant-numeric: tabular-nums; }
    .metric.redis { border-left: 3px solid var(--redis); }
    .metric.solr { border-left: 3px solid var(--solr); }
    .verdict { text-align: center; }
    .verdict .x { font-size: 1.9rem; font-weight: 700; color: var(--good); font-variant-numeric: tabular-nums; }
    .verdict .lbl { font-size: 0.7rem; color: var(--muted); text-transform: uppercase; letter-spacing: 0.08em; }
    .verdict.warn .x { color: #d8a02a; font-size: 1.1rem; }

    .bars { margin: 0.25rem 0 1.25rem; }
    .bar-row { display: grid; grid-template-columns: 3.4rem 1fr 5.5rem; gap: 0.6rem; align-items: center; margin: 0.3rem 0; }
    .bar-row .name { font-size: 0.75rem; color: var(--muted); }
    .bar-track { background: var(--panel); border-radius: 4px; height: 0.85rem; overflow: hidden; }
    .bar-fill { height: 100%; border-radius: 4px; transition: width 0.18s ease; }
    .bar-fill.redis { background: var(--redis); }
    .bar-fill.solr { background: var(--solr); }
    .bar-row .val { font-size: 0.78rem; text-align: right; font-variant-numeric: tabular-nums; color: var(--muted); }

    .panes { display: grid; grid-template-columns: 1fr 1fr; gap: 1rem; }
    @media (max-width: 860px) { .panes { grid-template-columns: 1fr; } .summary { grid-template-columns: 1fr; } }
    .pane { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; overflow: hidden; }
    .pane h2 {
      margin: 0; padding: 0.7rem 0.9rem; font-size: 0.85rem; font-weight: 600;
      border-bottom: 1px solid var(--line); display: flex; justify-content: space-between;
      align-items: baseline; gap: 0.5rem;
    }
    .pane h2 .count { color: var(--muted); font-size: 0.75rem; font-weight: 400; font-variant-numeric: tabular-nums; }
    .pane.redis h2 { color: var(--redis); }
    .pane.solr h2 { color: var(--solr); }
    .q {
      font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      font-size: 0.7rem; color: var(--muted); padding: 0.55rem 0.9rem;
      border-bottom: 1px solid var(--line); word-break: break-all; background: #12151b;
    }
    table { width: 100%; border-collapse: collapse; font-size: 0.82rem; }
    th { text-align: left; padding: 0.4rem 0.9rem; color: var(--muted); font-size: 0.68rem;
         text-transform: uppercase; letter-spacing: 0.06em; font-weight: 500; }
    td { padding: 0.4rem 0.9rem; border-top: 1px solid var(--line); }
    td.num { text-align: right; font-variant-numeric: tabular-nums; }
    .nm { font-weight: 550; }
    .tag { font-size: 0.68rem; color: var(--muted); }
    .empty { padding: 1.5rem 0.9rem; color: var(--muted); font-style: italic; text-align: center; }

    .note {
      margin-top: 1.5rem; padding: 0.85rem 1rem; background: var(--panel);
      border: 1px solid var(--line); border-left: 3px solid #4a5262;
      border-radius: 8px; font-size: 0.78rem; color: var(--muted);
    }
    .note b { color: var(--text); font-weight: 600; }
  </style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>Counterparty Search</h1>
    <span class="corpus" id="corpus">checking corpus…</span>
  </header>

  <div class="scenarios" id="scenarios">
    <button data-s="fuzzy" class="active">Typo-tolerant name</button>
    <button data-s="prefix">Prefix / autocomplete</button>
    <button data-s="filtered">Filtered screening</button>
    <button data-s="geo">Geo proximity</button>
    <button data-s="facet">Portfolio breakdown</button>
    <button data-s="lei">Exact LEI lookup</button>
  </div>
  <p class="hint" id="hint"></p>

  <div class="controls">
    <input type="text" id="q" autocomplete="off" spellcheck="false">
    <label class="inline">runs
      <select id="runs">
        <option value="1">1</option>
        <option value="5" selected>5</option>
        <option value="11">11</option>
        <option value="25">25</option>
      </select>
    </label>
    <label class="inline">order
      <select id="order">
        <option value="name" selected>name</option>
        <option value="relevance">relevance</option>
      </select>
    </label>
  </div>

  <div class="filters" id="filters">
    <label class="inline">country
      <select id="countries" multiple size="1" style="min-width:7rem">
        <option value="GB" selected>GB</option>
        <option value="US" selected>US</option>
        <option value="DE">DE</option>
        <option value="JP">JP</option>
        <option value="SG">SG</option>
        <option value="CH">CH</option>
        <option value="KY">KY</option>
      </select>
    </label>
    <label class="inline">rating ≥
      <select id="minRating">
        <option value="">any</option>
        <option value="13" selected>BBB-</option>
        <option value="16">A</option>
        <option value="19">AA-</option>
        <option value="22">AAA</option>
      </select>
    </label>
    <label class="inline">status
      <select id="status">
        <option value="">any</option>
        <option value="ACTIVE" selected>ACTIVE</option>
        <option value="PENDING">PENDING</option>
        <option value="SUSPENDED">SUSPENDED</option>
        <option value="TERMINATED">TERMINATED</option>
      </select>
    </label>
    <label class="inline">type
      <select id="entityTypes" multiple size="1" style="min-width:8rem">
        <option value="BANK">BANK</option>
        <option value="BROKER_DEALER">BROKER_DEALER</option>
        <option value="ASSET_MANAGER">ASSET_MANAGER</option>
        <option value="HEDGE_FUND">HEDGE_FUND</option>
        <option value="INSURER">INSURER</option>
        <option value="PENSION_FUND">PENSION_FUND</option>
        <option value="SPV">SPV</option>
        <option value="CORPORATE">CORPORATE</option>
        <option value="CCP">CCP</option>
        <option value="SOVEREIGN">SOVEREIGN</option>
      </select>
    </label>
    <label class="inline">sector
      <select id="sectors" multiple size="1" style="min-width:8rem">
        <option value="Banking">Banking</option>
        <option value="Insurance">Insurance</option>
        <option value="Asset Management">Asset Management</option>
        <option value="Energy">Energy</option>
        <option value="Utilities">Utilities</option>
        <option value="Technology">Technology</option>
        <option value="Real Estate">Real Estate</option>
        <option value="Sovereign">Sovereign</option>
        <option value="Mining">Mining</option>
      </select>
    </label>
    <label class="inline">risk ≤
      <select id="maxRisk">
        <option value="">any</option>
        <option value="20">20</option>
        <option value="40">40</option>
        <option value="60">60</option>
        <option value="80">80</option>
      </select>
    </label>
    <label class="inline">exposure ≥
      <select id="minExposure">
        <option value="">any</option>
        <option value="100000000">$100m</option>
        <option value="500000000">$500m</option>
        <option value="1000000000">$1bn</option>
        <option value="2500000000">$2.5bn</option>
      </select>
    </label>
    <label class="inline">onboarded
      <select id="onboardedMonths">
        <option value="">any time</option>
        <option value="12">last 12 months</option>
        <option value="24">last 24 months</option>
        <option value="60">last 5 years</option>
      </select>
    </label>
  </div>

  <div class="filters" id="geoControls">
    <label class="inline">near
      <select id="centre"></select>
    </label>
    <label class="inline">within
      <select id="radiusKm">
        <option value="10">10 km</option>
        <option value="50" selected>50 km</option>
        <option value="200">200 km</option>
        <option value="1000">1000 km</option>
      </select>
    </label>
  </div>

  <div class="filters" id="facetControls">
    <label class="inline">group by
      <select id="facetField">
        <option value="credit_rating" selected>credit_rating</option>
        <option value="country">country</option>
        <option value="entity_type">entity_type</option>
        <option value="sector">sector</option>
        <option value="status">status</option>
      </select>
    </label>
  </div>

  <div class="filters" id="leiControls">
    <button id="sampleLei" type="button">Pick a random LEI from the corpus</button>
  </div>

  <div class="summary">
    <div class="metric redis">
      <div class="engine">Redis Query Engine</div>
      <div class="time" id="rt">—</div>
      <div class="sub" id="rsub">&nbsp;</div>
    </div>
    <div class="verdict" id="verdict">
      <div class="x" id="vx">—</div>
      <div class="lbl">faster</div>
    </div>
    <div class="metric solr">
      <div class="engine">Apache Solr</div>
      <div class="time" id="st">—</div>
      <div class="sub" id="ssub">&nbsp;</div>
    </div>
  </div>

  <div class="bars" id="bars"></div>

  <div class="panes">
    <section class="pane redis">
      <h2>Redis <span class="count" id="rcount"></span></h2>
      <div class="q" id="rq"></div>
      <table>
        <thead><tr><th>Counterparty</th><th>Ctry</th><th>Rating</th><th class="num">Risk</th></tr></thead>
        <tbody id="rrows"><tr><td colspan="4" class="empty">Type to search</td></tr></tbody>
      </table>
    </section>
    <section class="pane solr">
      <h2>Solr <span class="count" id="scount"></span></h2>
      <div class="q" id="sq"></div>
      <table>
        <thead><tr><th>Counterparty</th><th>Ctry</th><th>Rating</th><th class="num">Risk</th></tr></thead>
        <tbody id="srows"><tr><td colspan="4" class="empty">Type to search</td></tr></tbody>
      </table>
    </section>
  </div>

  <div class="note" id="method"></div>
</div>

<script>
  const SCENARIOS = {
    fuzzy: {
      hint: 'Levenshtein distance 1 on both sides — Redis %term%, Solr term~1. Try a misspelling.',
      placeholder: 'kestral capitol',
      seed: 'kestral capitol',
      filters: false,
    },
    prefix: {
      hint: 'Wildcard on the final term as you type — one query per keystroke, on both engines.',
      placeholder: 'kes',
      seed: 'stonebr',
      filters: false,
    },
    filtered: {
      hint: 'Name prefix plus screening filters — Redis TAG/NUMERIC clauses, Solr fq params.',
      placeholder: 'kes',
      seed: 'kes',
      filters: true,
    },
    geo: {
      hint: 'Counterparties within a radius of a financial centre. Redis GEO takes lon,lat; Solr geofilt takes lat,lon — reversed.',
      placeholder: 'optional name filter',
      seed: '',
      filters: true,
      geo: true,
    },
    facet: {
      hint: 'Portfolio breakdown: count and total exposure per bucket. Redis FT.AGGREGATE vs Solr JSON Facet API — the one scenario where Solr wins.',
      seed: '',
      facet: true,
    },
    lei: {
      hint: 'Known-item retrieval. Redis reads the key directly with HGETALL and never touches the index; Solr must run a query.',
      placeholder: '20-character LEI',
      seed: '',
      lei: true,
    },
  };

  let scenario = 'fuzzy';
  let inflight = 0;

  const el = (id) => document.getElementById(id);

  function selectedCountries() {
    return Array.from(el('countries').selectedOptions).map((o) => o.value);
  }

  function setScenario(next) {
    scenario = next;
    for (const b of el('scenarios').children) b.classList.toggle('active', b.dataset.s === next);
    const cfg = SCENARIOS[next];
    el('hint').textContent = cfg.hint;
    el('q').placeholder = cfg.placeholder || '';
    el('q').value = cfg.seed;
    el('filters').classList.toggle('show', Boolean(cfg.filters));
    el('geoControls').classList.toggle('show', Boolean(cfg.geo));
    el('facetControls').classList.toggle('show', Boolean(cfg.facet));
    el('leiControls').classList.toggle('show', Boolean(cfg.lei));
    // The facet scenario has no free-text query, and ordering doesn't apply.
    el('q').style.display = cfg.facet ? 'none' : '';
    el('order').closest('label').style.display = (cfg.facet || cfg.lei) ? 'none' : '';
    search();
  }

  // Renders the aggregation buckets in place of the results table.
  function renderBuckets(tbody, buckets) {
    if (!buckets.length) {
      tbody.innerHTML = '<tr><td colspan="4" class="empty">No buckets</td></tr>';
      return;
    }
    tbody.replaceChildren(...buckets.map((b) => {
      const tr = document.createElement('tr');
      const v = document.createElement('td');
      const strong = document.createElement('div');
      strong.className = 'nm';
      // Shown exactly as each engine returns it. Redis lowercases SORTABLE tag
      // values, so its labels differ in case from Solr's — that is real
      // behaviour, not a rendering bug, and the note below explains it.
      strong.textContent = b.value;
      v.append(strong);
      const c = document.createElement('td');
      c.className = 'num';
      c.textContent = b.count.toLocaleString();
      const e = document.createElement('td');
      e.className = 'num';
      e.colSpan = 2;
      e.textContent = `$${(b.exposure / 1e9).toFixed(1)}bn`;
      tr.append(v, c, e);
      return tr;
    }));
  }

  function setHeaders(cols) {
    for (const side of ['r', 's']) {
      const thead = el(`${side}rows`).previousElementSibling;
      thead.replaceChildren(...[document.createElement('tr')].map((tr) => {
        for (const [label, cls] of cols) {
          const th = document.createElement('th');
          th.textContent = label;
          if (cls) th.className = cls;
          tr.append(th);
        }
        return tr;
      }));
    }
  }

  function renderRows(tbody, hits) {
    if (!hits.length) {
      tbody.innerHTML = '<tr><td colspan="4" class="empty">No matches</td></tr>';
      return;
    }
    // textContent throughout: counterparty names are data, not markup.
    tbody.replaceChildren(...hits.map((h) => {
      const tr = document.createElement('tr');
      const name = document.createElement('td');
      const strong = document.createElement('div');
      strong.className = 'nm';
      strong.textContent = h.legal_name || '';
      const sub = document.createElement('div');
      sub.className = 'tag';
      // Aliases have to be visible. A search for "kes" legitimately returns
      // "Aberdare Advisory GmbH" when it carries the alias "Kestrel Advisory
      // (former)" — a pre-merger name, which is exactly the counterparty
      // matching problem this demo is about. Without showing the alias, that
      // row looks like a wrong result.
      sub.textContent = [h.entity_type, h.aliases].filter(Boolean).join(' · ');
      name.append(strong, sub);
      const c = document.createElement('td');
      c.textContent = h.country || '';
      const r = document.createElement('td');
      r.textContent = h.credit_rating || '';
      const risk = document.createElement('td');
      risk.className = 'num';
      risk.textContent = Number.isFinite(h.risk_score) ? h.risk_score.toFixed(1) : '';
      tr.append(name, c, r, risk);
      return tr;
    }));
  }

  function renderBars(redisMs, solrMs, solrQTime) {
    const max = Math.max(redisMs, solrMs, 0.001);
    const rows = [
      ['Redis', redisMs, 'redis', 'wall clock, app-observed'],
      ['Solr', solrMs, 'solr', 'wall clock, app-observed'],
    ];
    if (Number.isFinite(solrQTime)) rows.push(['Solr QTime', solrQTime, 'solr', 'Solr-internal, excludes HTTP']);
    el('bars').replaceChildren(...rows.map(([name, ms, cls]) => {
      const row = document.createElement('div');
      row.className = 'bar-row';
      const n = document.createElement('div');
      n.className = 'name';
      n.textContent = name;
      const track = document.createElement('div');
      track.className = 'bar-track';
      const fill = document.createElement('div');
      fill.className = `bar-fill ${cls}`;
      fill.style.width = `${Math.max((ms / max) * 100, 0.6)}%`;
      if (name === 'Solr QTime') fill.style.opacity = '0.45';
      track.append(fill);
      const v = document.createElement('div');
      v.className = 'val';
      v.textContent = `${ms.toFixed(2)} ms`;
      row.append(n, track, v);
      return row;
    }));
  }

  function multi(id) {
    return Array.from(el(id).selectedOptions).map((o) => o.value);
  }

  async function search() {
    const cfg = SCENARIOS[scenario];
    const seq = ++inflight;
    let url;

    if (cfg.facet) {
      url = `/api/facet?field=${el('facetField').value}&runs=${el('runs').value}`;
    } else if (cfg.lei) {
      url = `/api/lei?lei=${encodeURIComponent(el('q').value.trim())}&runs=${el('runs').value}`;
    } else {
      const params = new URLSearchParams({
        scenario,
        q: el('q').value,
        runs: el('runs').value,
        order: el('order').value,
        limit: '10',
      });
      if (cfg.filters) {
        params.set('countries', selectedCountries().join(','));
        params.set('minRating', el('minRating').value);
        params.set('status', el('status').value);
        params.set('entityTypes', multi('entityTypes').join(','));
        params.set('sectors', multi('sectors').join(','));
        params.set('maxRisk', el('maxRisk').value);
        params.set('minExposure', el('minExposure').value);
        params.set('onboardedMonths', el('onboardedMonths').value);
      }
      if (cfg.geo) {
        params.set('centre', el('centre').value);
        params.set('radiusKm', el('radiusKm').value);
      }
      url = `/api/search?${params}`;
    }

    let d;
    try {
      const res = await fetch(url);
      d = await res.json();
      if (!res.ok) throw new Error(d.error || `HTTP ${res.status}`);
    } catch (err) {
      el('method').innerHTML = `<b>Error:</b> ${err.message}`;
      return;
    }
    if (seq !== inflight) return;

    // ---- facet and LEI have their own shapes; handle and return early.
    if (cfg.facet) {
      setHeaders([['Bucket', ''], ['Count', 'num'], ['Exposure', 'num']]);
      el('rt').textContent = `${d.redis.ms.toFixed(2)} ms`;
      el('st').textContent = `${d.solr.ms.toFixed(2)} ms`;
      el('rsub').textContent = `median of ${d.runs} · ${d.redis.buckets.length} buckets`;
      el('ssub').textContent = `median of ${d.runs} · QTime ${d.solr.qtime} ms · ${d.solr.buckets.length} buckets`;
      const v = el('verdict');
      v.classList.toggle('warn', !d.bucketsAgree);
      el('vx').textContent = d.bucketsAgree
        ? (d.speedup >= 1 ? `${d.speedup}×` : `Solr ${(1 / d.speedup).toFixed(1)}× faster`)
        : 'buckets differ';
      el('rcount').textContent = `${d.redis.buckets.length} buckets`;
      el('scount').textContent = `${d.solr.buckets.length} buckets`;
      el('rq').textContent = d.redis.query;
      el('sq').textContent = d.solr.query;
      renderBuckets(el('rrows'), d.redis.buckets);
      renderBuckets(el('srows'), d.solr.buckets);
      renderBars(d.redis.ms, d.solr.ms, d.solr.qtime);
      el('method').innerHTML =
        '<b>Aggregation is the scenario Solr usually wins,</b> and it is included for that reason. ' +
        'Redis groups with FT.AGGREGATE; Solr uses the JSON Facet API over docValues, which is ' +
        'column-oriented and very good at exactly this. The counts and sums are compared, not just ' +
        'the timings — if they diverged the numbers would be describing different questions. ' +
        'Redis labels are lowercase because grouping on a SORTABLE tag returns the normalised copy; ' +
        'preserving the original casing needs LOAD, which costs roughly 3×. ' +
        'Redis TAG fields carry SORTABLE here so both engines group from a column store rather ' +
        'than one of them reading whole records.';
      return;
    }

    if (cfg.lei) {
      setHeaders([['Field', ''], ['Value', '']]);
      el('rt').textContent = `${d.redis.ms.toFixed(3)} ms`;
      el('st').textContent = `${d.solr.ms.toFixed(3)} ms`;
      el('rsub').textContent = `median of ${d.runs} · ${d.redis.found ? 'found' : 'not found'}`;
      el('ssub').textContent = `median of ${d.runs} · QTime ${d.solr.qtime} ms · ${d.solr.found ? 'found' : 'not found'}`;
      const v = el('verdict');
      v.classList.toggle('warn', !d.agree);
      el('vx').textContent = d.agree ? `${d.speedup}×` : 'engines disagree';
      el('rcount').textContent = d.redis.found ? 'hit' : 'miss';
      el('scount').textContent = d.solr.found ? 'hit' : 'miss';
      el('rq').textContent = d.redis.query;
      el('sq').textContent = d.solr.query;
      const rowsFor = (name) => name
        ? [['legal_name', name]]
        : [['result', 'no such LEI in the corpus']];
      for (const [tbodyId, name] of [['rrows', d.redis.name], ['srows', d.solr.name]]) {
        el(tbodyId).replaceChildren(...rowsFor(name).map(([k, val]) => {
          const tr = document.createElement('tr');
          const a = document.createElement('td');
          a.className = 'tag';
          a.textContent = k;
          const b = document.createElement('td');
          b.className = 'nm';
          b.textContent = val;
          tr.append(a, b);
          return tr;
        }));
      }
      renderBars(d.redis.ms, d.solr.ms, d.solr.qtime);
      el('method').innerHTML =
        '<b>This one is a structural difference, not just a faster index.</b> The record lives at a ' +
        'known key, so Redis reads it with HGETALL and never consults the search index at all — O(1). ' +
        'Solr has no equivalent path: a document is only reachable through a query, because search ' +
        'is the only way in. For counterparty systems that matters, since most production lookups ' +
        'are by identifier rather than by name.';
      return;
    }

    // The stale-response guard now lives right after the fetch, above, so it
    // covers the facet and LEI paths too.
    setHeaders([['Counterparty', ''], ['Ctry', ''], ['Rating', ''], ['Risk', 'num']]);

    el('rt').textContent = `${d.redis.ms.toFixed(2)} ms`;
    el('st').textContent = `${d.solr.ms.toFixed(2)} ms`;
    el('rsub').textContent = `median of ${d.runs} · ${d.redis.total.toLocaleString()} matches`;
    el('ssub').textContent =
      `median of ${d.runs} · QTime ${d.solr.qtime} ms · ${d.solr.total.toLocaleString()} matches`;

    const verdict = el('verdict');
    if (!d.totalsMatch) {
      // Refuse to show a multiplier when the engines matched different
      // numbers of documents — that would be comparing two different queries.
      verdict.classList.add('warn');
      el('vx').textContent = 'totals differ';
    } else {
      verdict.classList.remove('warn');
      el('vx').textContent = `${d.speedup}×`;
    }

    el('rcount').textContent = `${d.redis.total.toLocaleString()} matches`;
    el('scount').textContent = `${d.solr.total.toLocaleString()} matches`;
    el('rq').textContent = d.redis.query;
    el('sq').textContent = d.solr.query;
    renderRows(el('rrows'), d.redis.hits);
    renderRows(el('srows'), d.solr.hits);
    renderBars(d.redis.ms, d.solr.ms, d.solr.qtime);

    const orderNote = d.order === 'name'
      ? '<b>Ordered by name on both sides,</b> so the two panes are directly comparable. ' +
        'Wildcard and prefix queries score every match identically on both engines, so with ' +
        'relevance ordering "top 10" is decided by each engine’s internal document order and the ' +
        'panes show a different arbitrary ten out of the same result set. Switch order to ' +
        '<b>relevance</b> to see that — and note Redis does differentiate scores on fuzzy queries, ' +
        'which a name sort discards. '
      : '<b>Ordered by relevance,</b> so the panes may list different rows even when the totals ' +
        'match: on wildcard and prefix queries every hit scores identically, so the tie is broken ' +
        'by each engine’s internal document order. Switch order to <b>name</b> for a row-for-row ' +
        'comparison. ';

    el('method').innerHTML =
      orderNote +
      '<b>How this is measured.</b> Both engines run the same query the same number of times, ' +
      'alternating which goes first, and the <b>median</b> is reported — not the best case. ' +
      'Times are wall clock as the application sees them, including protocol and deserialisation. ' +
      'Solr’s own <b>QTime</b> is shown too: its internal search is very fast, and much of its ' +
      'wall-clock time is HTTP and JSON. That gap is the point — it is the cost of talking to a ' +
      'search server over HTTP versus Redis over a persistent binary connection — but you should ' +
      'see both numbers rather than take one on trust. Solr’s caches are warmed at seed time.';
  }

  let debounce;
  el('q').addEventListener('input', () => {
    clearTimeout(debounce);
    // 120ms: long enough to avoid a request per character on fast typing,
    // short enough that per-keystroke latency still feels live.
    debounce = setTimeout(search, 120);
  });
  el('runs').addEventListener('change', search);
  el('order').addEventListener('change', search);
  for (const id of ['countries', 'minRating', 'status', 'entityTypes', 'sectors',
    'maxRisk', 'minExposure', 'onboardedMonths', 'centre', 'radiusKm', 'facetField']) {
    el(id).addEventListener('change', search);
  }
  el('sampleLei').addEventListener('click', async () => {
    const s = await (await fetch('/api/sample-lei')).json();
    if (s.lei) { el('q').value = s.lei; search(); }
  });
  el('scenarios').addEventListener('click', (e) => {
    if (e.target.dataset.s) setScenario(e.target.dataset.s);
  });

  (async () => {
    try {
      // Geo centres come from the server so the dropdown can't drift from the
      // coordinates the queries actually use.
      const meta = await (await fetch('/api/meta')).json();
      el('centre').replaceChildren(...meta.centres.map((c) => {
        const o = document.createElement('option');
        o.value = c.key;
        o.textContent = c.label;
        return o;
      }));
    } catch { /* dropdown stays empty; the server defaults to London */ }

    try {
      const s = await (await fetch('/api/stats')).json();
      const match = s.redis.docs === s.solr.docs;
      el('corpus').innerHTML =
        `<b>${s.redis.docs.toLocaleString()}</b> counterparties in Redis · ` +
        `<b>${s.solr.docs.toLocaleString()}</b> in Solr` +
        (match ? ' · identical corpus' : ' · <span style="color:#d8a02a">COUNTS DIFFER</span>');
    } catch {
      el('corpus').textContent = 'could not read corpus stats';
    }
    setScenario('fuzzy');
  })();
</script>
</body>
</html>
